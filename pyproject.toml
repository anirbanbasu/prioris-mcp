[project]
name = "prioris-mcp"
version = "0.1.0"
description = "A model context protocol (MCP) server to facilitate looking up prior art."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Anirban Basu", email = "anirbanbasu@users.noreply.github.com" }
]
keywords = ["python3", "prior-art", "server", "model-context-protocol-server", "mcp-server"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "anyio>=4.14.2",
    "defusedxml>=0.7.1",
    "environs>=15.0.1",
    "fastmcp>=3.4.4",
    "httpx>=0.28.1",
    "liteparse>=2.9.0",
    "lxml>=6.1.1",
    "markdownify>=1.2.3",
]

[project.scripts]
prioris-mcp = "prioris_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "icecream>=2.1.8",
    "ty>=0.0.1a29",
]
docs = [
    "zensical>=0.0.51",
]
test = [
    "coverage>=7.9.1",
    "pytest>=8.4.1",
]

[tool.ty.rules]
possibly-unresolved-reference = "warn"
# Keyword argument expansion is not supported by ty yet? https://github.com/astral-sh/ty/issues/247
invalid-argument-type = "ignore"

[tool.ty.environment]
python-version = "3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
include = [
    "src/prioris_mcp/**/*.py",
    "tests/**/*.py",
    "docs/**/*.py",
]

[tool.ruff.lint]
extend-select = [
    "Q",
    "RUF100",
    "RUF018", # https://docs.astral.sh/ruff/rules/assignment-in-assert/
    "C90",
    "UP",
    "I",
    "D",
    "TID251",
]
# flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 15 }
ignore = [
    "D100", # ignore missing docstring in module
    "D102", # ignore missing docstring in public method
    "D104", # ignore missing docstring in public package
    "D105", # ignore missing docstring in magic methods
    "D107", # ignore missing docstring in __init__ methods
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["prioris-mcp"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# don't format python in docstrings, pytest-examples takes care of it
docstring-code-format = false
# quote-style = "single"

[tool.coverage.run]
omit = [
    "tests/*", # Excludes all files and subdirectories within a 'tests' directory at the project root
]

[tool.coverage.report]
fail_under = 100
skip_covered = true
show_missing = true
ignore_errors = true
precision = 2
exclude_lines = [
    # `# pragma: no cover` is standard marker for code that's not covered, this will error if code is covered
    'pragma: no cover',
    # use `# pragma: lax no cover` if you want to ignore cases where (some of) the code is covered
    'pragma: lax no cover',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    'if typing.TYPE_CHECKING:',
    '@overload',
    '@deprecated',
    '@typing.overload',
    '@abstractmethod',
    '\(Protocol\):$',
    'typing.assert_never',
    '$\s*assert_never\(',
    'if __name__ == .__main__.:',
    'except ImportError as _import_error:',
    '$\s*pass$',
    'assert False',
]
